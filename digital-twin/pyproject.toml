[project]
name = "video2world_model"
version = "0.2.0"
description = "Video-to-robotics-sim digital twin prototype"
requires-python = ">=3.11,<3.13"
dependencies = [
    "flask>=3.0.0",
    "numpy>=1.26.0,<2",
    "openai>=2.0.0",
    "opencv-python>=4.9.0",
    "ultralytics>=8.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]
vggt = [
    "torch==2.3.1",
    "torchvision==0.18.1",
    "vggt @ git+https://github.com/facebookresearch/vggt.git",
]

[project.scripts]
video-to-sim = "sim_pipeline:main"
sim-preview = "sim_pipeline:preview_main"
vggt-reconstruct = "vggt_adapter:main"
clean-reconstruction = "vggt_adapter:clean_main"
rgbd-to-sim = "rgbd_adapter:main"
vlm-to-blender-mesh = "vlm_mesh_adapter:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = [
    "app",
    "database",
    "perception",
    "rgbd_adapter",
    "sim_pipeline",
    "vggt_adapter",
    "vlm_mesh_adapter",
    "world_model",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
